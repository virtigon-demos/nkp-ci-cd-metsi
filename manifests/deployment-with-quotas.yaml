apiVersion: apps/v1
kind: Deployment
metadata:
  name: nkp-demo-app-2
  namespace: demo-2
  labels:
    app: nkp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nkp-demo
  template:
    metadata:
      labels:
        app: nkp-demo
    spec:
      containers:
        - name: nkp-demo
          image: ghcr.io/virtigon-demos/nkp-ci-cd-metsi:v202601231047
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "800m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: APP_VERSION
              value: "v1.1"
            - name: BUILD_VERSION
              value: "v202601231047"

---

apiVersion: v1
kind: Service
metadata:
  name: nkp-demo-service
  namespace: demo-2
spec:
  type: LoadBalancer
  selector:
    app: nkp-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
